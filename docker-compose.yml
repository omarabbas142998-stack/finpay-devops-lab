services:
  db:
    image: postgres:16
    container_name: finpay-db
    environment:
      POSTGRES_USER: finpay_user
      POSTGRES_PASSWORD: finpay_pass123
      POSTGRES_DB: finpay_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpay_user -d finpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: finpay-api
    environment:
      DATABASE_URL: postgresql://finpay_user:finpay_pass123@db:5432/finpay_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
