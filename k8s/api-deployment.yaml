apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpay-api
  namespace: finpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finpay-api
  template:
    metadata:
      labels:
        app: finpay-api
    spec:
      containers:
        - name: finpay-api
          image: finpay-devops-lab-api:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: "postgresql://finpay_user:finpay_pass123@postgres:5432/finpay_db"
          ports:
            - containerPort: 8000
