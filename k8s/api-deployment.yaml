apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpay-api
  namespace: finpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finpay-api
  template:
    metadata:
      labels:
        app: finpay-api
    spec:
      containers:
        - name: finpay-api
          image: finpay-devops-lab-api:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: api-secret
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
